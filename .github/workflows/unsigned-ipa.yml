name: Unsigned Slide IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build IPA and run tests
        run: bash tooling/build-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Slide-ipa
          path: |
            build/ipa/Slide.ipa
            build/ipa/Slide-no-extension.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Attach the IPA to this version's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^[[:space:]]*MARKETING_VERSION = \(.*\);/\1/p' Slide.xcodeproj/project.pbxproj | head -1)
          TAG="v${VERSION}"
          mkdir -p build
          rm -f build/Slide-appstore.zip
          (cd appstore && zip -r -q "../build/Slide-appstore.zip" .)
          notes=$"Slide ${VERSION}.\n\nSideload Slide.ipa with a free Apple ID (or Slide-no-extension.ipa if the Live Activity is refused). Re-sign about every 7 days without deleting the app.\n\nSlide.apk is the Android debug build. Slide-appstore.zip holds the store listing and screenshots."
          files=(build/ipa/Slide.ipa build/ipa/Slide-no-extension.ipa build/Slide-appstore.zip)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --title "Slide ${VERSION}" \
              --notes "$notes" \
              --latest
          fi

  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$MANAGER" --licenses >/dev/null || true
          "$MANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Debug keystore
        working-directory: android/app
        run: keytool -genkeypair -keystore slide-debug.keystore -storepass android -alias slide -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Slide,O=Slide,C=CH"

      - name: Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Assemble
        working-directory: android
        env:
          SLIDE_KEYSTORE: slide-debug.keystore
        run: gradle testDebugUnitTest assembleDebug --no-daemon

      - name: Attach Slide.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^[[:space:]]*MARKETING_VERSION = \(.*\);/\1/p' Slide.xcodeproj/project.pbxproj | head -1)
          TAG="v${VERSION}"
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$APK" Slide.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Slide.apk --clobber
          else
            gh release create "$TAG" Slide.apk --title "Slide ${VERSION}" --notes "Slide ${VERSION}. Android debug APK plus the iOS build." --latest
          fi
