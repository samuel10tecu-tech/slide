name: Unsigned Slide IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build IPA and run tests
        run: bash tooling/build-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Slide-ipa
          path: |
            build/ipa/Slide.ipa
            build/ipa/Slide-no-extension.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Attach the IPA to this version's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^[[:space:]]*MARKETING_VERSION = \(.*\);/\1/p' Slide.xcodeproj/project.pbxproj | head -1)
          TAG="v${VERSION}"
          mkdir -p build
          rm -f build/Slide-appstore.zip
          (cd appstore && zip -r -q "../build/Slide-appstore.zip" .)
          notes=$"Slide ${VERSION} for Sideloadly.\n\nUse Slide.ipa. If Sideloadly refuses the Live Activity extension, use Slide-no-extension.ipa. A free Apple ID must re-sign about every 7 days. Do not delete the app first if you want to keep saved days.\n\nSlide-appstore.zip holds the App Store listing text and screenshots."
          files=(build/ipa/Slide.ipa build/ipa/Slide-no-extension.ipa build/Slide-appstore.zip)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --title "Slide ${VERSION}" \
              --notes "$notes" \
              --latest
          fi
